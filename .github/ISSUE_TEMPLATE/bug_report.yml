name: Bug report
description: Something in Vault Studio does not work as expected.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove API keys, vault paths, and private note contents before submitting.
  - type: input
    id: version
    attributes:
      label: Vault Studio version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.1-rc.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: macOS 15 · Node 22.19
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Search / retrieval
        - Notes / writes
        - Settings / embeddings
        - Agent tools
        - Installation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal, redacted example.
      placeholder: |
        1. Configure a vault with N notes
        2. Search for ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Redact paths, note text, and credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, private note content, and full vault paths from this report.
          required: true
